[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dementia-prediction"
version = "0.1.0"
description = "Baseline longitudinal dementia prediction with regional DAWM using Cox proportional hazards models."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.15",
    "scikit-learn>=1.9",
    "scikit-survival>=0.28",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/dementia_prediction"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
